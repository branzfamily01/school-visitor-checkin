name: Apply reception hotfix

on:
  push:
    branches: [fix/reception-search-cancel-20260904]
    paths:
      - '.github/workflows/apply-reception-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/reception-search-cancel-20260904
      - name: Patch app, manual and cache
