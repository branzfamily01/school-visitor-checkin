name: Apply reception hotfix

on:
  push:
    branches: [fix/reception-search-cancel-20260904]
    paths:
      - '.github/workflows/apply-reception-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/reception-search-cancel-20260904
      - name: Patch app, manual and cache
        run: |
          python3 -c "import base64;exec(compile(base64.b64decode(''),'hotfix.py','exec'))"
          git config user.name 'branzfamily01'
          git config user.email 'branz.family.01@gmail.com'
          git add app-part-*.js index.html manual.html service-worker.js .github/workflows/apply-reception-hotfix.yml
          git commit -m 'Fix reception search, cancel and handoff CSV'
          git push origin HEAD:fix/reception-search-cancel-20260904
